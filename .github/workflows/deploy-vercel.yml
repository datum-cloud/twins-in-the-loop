name: Deploy Vercel production

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx vercel@59.15.1 pull --yes --environment=production
      - run: npx vercel@59.15.1 build --prod
      - id: deploy
        run: |
          url="$(npx vercel@59.15.1 deploy --prebuilt --prod --yes | tail -n 1)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
