name: Auto PR

on:
  push:
    branches-ignore:
      - main
      - 'release-please--*'

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Open pull request if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(gh pr list --head "$GITHUB_REF_NAME" --base main --state open --json number --jq '.[0].number')" ]; then
            echo "Pull request already exists for $GITHUB_REF_NAME"
            exit 0
          fi
          git fetch origin main
          gh pr create --fill --base main --head "$GITHUB_REF_NAME"
