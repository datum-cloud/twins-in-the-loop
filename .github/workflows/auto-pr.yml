name: Auto PR

on:
  push:
    branches-ignore:
      - main
      - 'release-please--*'

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Open pull request if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr view --head "$GITHUB_REF_NAME" --json number --jq .number >/dev/null 2>&1; then
            echo "Pull request already exists for $GITHUB_REF_NAME"
            exit 0
          fi
          gh pr create --fill --base main --head "$GITHUB_REF_NAME"
