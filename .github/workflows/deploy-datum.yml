name: Deploy Datum Compute

# Manual only. Production still ships through deploy-vercel.yml; this builds the
# unikernel image from Dockerfile.datum and rolls it out to Datum Compute.
on:
  workflow_dispatch:
    inputs:
      project:
        description: Datum project ID (falls back to the DATUM_PROJECT repo variable)
        default: project-z6vm2
      location:
        description: Datum Compute location
        default: us-central-1
      site_env:
        description: PUBLIC_SITE_ENV baked into the image (production hides /api/diag)
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  packages: write

concurrency:
  group: datum-compute
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/datum-cloud/twins-in-the-loop
  WORKLOAD: twins-in-the-loop
  SECRET_NAME: twins-strapi-secrets
  DATUMCTL_VERSION: 0.21.0
  COMPUTE_PLUGIN_VERSION: v0.12.4

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: datum-compute
      url: ${{ steps.deploy.outputs.url }}
    env:
      DATUM_PROJECT: ${{ inputs.project || vars.DATUM_PROJECT }}
    steps:
      - uses: actions/checkout@v5

      - name: Install datumctl
        run: |
          curl -fsSLo "$RUNNER_TEMP/datumctl.deb" \
            "https://github.com/datum-cloud/datumctl/releases/download/v${DATUMCTL_VERSION}/datumctl_${DATUMCTL_VERSION}_linux_amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/datumctl.deb"
          # The 72 MB plugin download has a fixed 60 s client timeout.
          for attempt in 1 2 3; do
            datumctl plugin install "compute@${COMPUTE_PLUGIN_VERSION}" && break
            [ "$attempt" = 3 ] && { echo "::error::could not install the compute plugin"; exit 1; }
            sleep 10
          done

      - name: Log in to Datum Cloud
        env:
          DATUM_SA_CREDENTIALS: ${{ secrets.DATUM_SA_CREDENTIALS }}
        run: |
          umask 077
          printf '%s' "$DATUM_SA_CREDENTIALS" > "$RUNNER_TEMP/datum-sa.json"
          datumctl login --credentials "$RUNNER_TEMP/datum-sa.json"
          rm -f "$RUNNER_TEMP/datum-sa.json"

      # Fail before building 650 MB if the instances could not reach Strapi.
      - name: Check the Strapi Secret exists
        run: |
          datumctl get secret "$SECRET_NAME" -n default --project "$DATUM_PROJECT" -o json |
            jq -e '.data | has("STRAPI_URL") and has("STRAPI_TOKEN") and has("STRAPI_WEBHOOK_SECRET")' >/dev/null || {
              echo "::error::Secret '$SECRET_NAME' is missing or lacks STRAPI_URL/STRAPI_TOKEN/STRAPI_WEBHOOK_SECRET in $DATUM_PROJECT"
              exit 1
            }

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Must be `datumctl compute build`: an image from plain `docker build`
      # pulls fine but cannot boot on the unikernel runtime. A unique tag per
      # commit matters too, because redeploying the same tag does not replace
      # the running instance.
      - name: Build and push the unikernel image
        id: build
        env:
          SITE_ENV: ${{ inputs.site_env }}
        run: |
          image="${IMAGE_REPO}:sha-${GITHUB_SHA::7}"
          datumctl compute build --push \
            --build-arg "PUBLIC_SITE_ENV=${SITE_ENV}" \
            --output "$image" .
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Deploy
        id: deploy
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          LOCATION: ${{ inputs.location }}
        run: |
          datumctl compute deploy "$WORKLOAD" \
            --project "$DATUM_PROJECT" \
            --image "$IMAGE" \
            --location "$LOCATION" \
            --http-port 4321 \
            --instance-type datumcloud/d1-standard-2 \
            --runtime-class unikernel \
            --env "HOST=::" \
            --env-from-secret "$SECRET_NAME" \
            --yes | tee "$RUNNER_TEMP/deploy.log"
          url="$(grep -oE 'https://[a-z0-9.-]+\.datumproxy\.net' "$RUNNER_TEMP/deploy.log" | tail -n 1)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"

      # The URL's DNS can lag the rollout by a minute, and the edge may answer
      # 503 until the instance is reachable, so retry before failing.
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          [ -n "$URL" ] || { echo "::error::deploy printed no URL"; exit 1; }
          for i in $(seq 1 12); do
            code="$(curl -s -o /dev/null -m 15 -w '%{http_code}' "$URL/" || true)"
            echo "attempt $i: GET / -> ${code:-000}"
            if [ "$code" = 200 ]; then
              items="$(curl -s -m 20 "$URL/rss.xml" | grep -o '<item>' | wc -l)"
              echo "rss items: $items"
              [ "$items" -gt 0 ] && exit 0
              echo "::error::/ is up but /rss.xml has no items; Strapi content did not load"
              exit 1
            fi
            sleep 15
          done
          echo "::error::$URL did not return 200 within 3 minutes"
          exit 1

      - name: Summary
        if: always()
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### Datum Compute"
            echo "- Project: \`$DATUM_PROJECT\`"
            echo "- Image: \`${IMAGE:-not built}\`"
            echo "- URL: ${URL:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
