name: Deploy Datum Compute

on:
  workflow_dispatch:
    inputs:
      location:
        description: Datum Compute location
        default: us-central-1

permissions:
  contents: read
  packages: write

concurrency:
  group: datum-compute
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/datum-cloud/twins-in-the-loop
  DATUMCTL_VERSION: 0.20.0
  COMPUTE_PLUGIN_VERSION: v0.8.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: datum-compute
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            PUBLIC_SITE_ENV=staging
          tags: |
            ${{ env.IMAGE_REPO }}:sha-${{ github.sha }}
            ${{ env.IMAGE_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install datumctl
        run: |
          curl -fsSLo /tmp/datumctl.deb \
            "https://github.com/datum-cloud/datumctl/releases/download/v${DATUMCTL_VERSION}/datumctl_${DATUMCTL_VERSION}_linux_amd64.deb"
          sudo dpkg -i /tmp/datumctl.deb
          datumctl plugin install "compute@${COMPUTE_PLUGIN_VERSION}"

      - name: Log in to Datum Cloud
        env:
          DATUM_SA_CREDENTIALS: ${{ secrets.DATUM_SA_CREDENTIALS }}
        run: |
          printf '%s' "$DATUM_SA_CREDENTIALS" > "$RUNNER_TEMP/datum-sa.json"
          datumctl login --credentials "$RUNNER_TEMP/datum-sa.json"
          rm "$RUNNER_TEMP/datum-sa.json"

      - id: deploy
        env:
          IMAGE: ${{ env.IMAGE_REPO }}@${{ steps.build.outputs.digest }}
          LOCATION: ${{ inputs.location }}
        run: ./datum/deploy.sh | tee "$RUNNER_TEMP/deploy.log"; grep '^url=' "$RUNNER_TEMP/deploy.log" >> "$GITHUB_OUTPUT"
